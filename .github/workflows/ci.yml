name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ============================================
  # 代码检查
  # ============================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff>=0.9"

      # 老代码是教程风格，全量 E/W/UP 规则暂时过不了；这里分两道闸门：
      #   1) 全仓只拦「真错误」（语法错误、未定义名、重复定义等）
      #   2) 新代码（tests/ evals/）按全量规则 + 格式化严格执行
      - name: Ruff check (repo-wide hard errors)
        run: ruff check . --select E9,F63,F7,F82

      - name: "Ruff check (new code: tests + evals)"
        run: ruff check tests evals

      - name: Ruff format check (new code)
        run: ruff format --check tests evals

  # ============================================
  # 语法检查（不装依赖，compile 只需要解释器）
  # ============================================
  syntax:
    name: Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check syntax (compile all .py files)
        run: python -m compileall agent api tools utils evals tests

  # ============================================
  # 单元测试
  # ============================================
  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ hashFiles('.github/workflows/ci.yml') }}

      # 单测只 import 到这几个包，不必装全量 requirements（pycairo 等在 Linux 上要编译系统库）
      - name: Install test dependencies
        run: |
          pip install pytest \
            fastapi \
            pydantic \
            langchain-core \
            mysql-connector-python \
            tavily-python \
            python-dotenv

      - name: Run tests
        run: pytest -q

  # ============================================
  # Docker 镜像构建验证
  # ============================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, syntax, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t multiagent-search .
