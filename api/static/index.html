<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MultiAgent-Search — 电商运营智能分析</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117; --panel: #161822; --border: #252836; --text: #e1e4ed;
    --text-dim: #7b8198; --accent: #6366f1; --accent-glow: rgba(99,102,241,.18);
    --green: #22c55e; --green-bg: rgba(34,197,94,.12);
    --blue: #3b82f6; --blue-bg: rgba(59,130,246,.12);
    --orange: #f59e0b; --orange-bg: rgba(245,158,11,.12);
    --red: #ef4444; --red-bg: rgba(239,68,68,.12);
    --purple: #a855f7; --purple-bg: rgba(168,85,247,.12);
    --teal: #2dd4bf; --teal-bg: rgba(45,212,191,.12);
    --radius: 10px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  body {
    font-family: var(--font); background: var(--bg); color: var(--text);
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }

  /* ── header ── */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  header h1 { font-size: 17px; font-weight: 700; letter-spacing: -.3px; }
  header h1 span { color: var(--accent); }
  .ws-badge {
    display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim);
    background: var(--panel); padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border);
  }
  .ws-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
  .ws-dot.off { background: var(--red); }

  /* ── input bar ── */
  .input-bar {
    display: flex; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .input-bar input {
    flex: 1; padding: 11px 14px; font-size: 14px; font-family: var(--font);
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    color: var(--text); outline: none; transition: border-color .2s;
  }
  .input-bar input:focus { border-color: var(--accent); }
  .input-bar input::placeholder { color: #4a5070; }
  .btn {
    padding: 10px 18px; font-size: 13px; font-weight: 600; font-family: var(--font);
    border: none; border-radius: var(--radius); cursor: pointer;
    white-space: nowrap; transition: all .15s;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { box-shadow: 0 0 16px var(--accent-glow); }
  .btn-primary:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
  .btn-ghost {
    background: transparent; color: var(--text-dim); border: 1px solid var(--border);
    font-weight: 500;
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--text-dim); }
  .btn-ghost.active { color: var(--text); border-color: var(--accent); background: rgba(99,102,241,.08); }

  /* ── tab bar ── */
  .tab-bar {
    display: flex; align-items: center; gap: 4px; padding: 0 20px;
    border-bottom: 1px solid var(--border); flex-shrink: 0;
    overflow-x: auto; min-height: 42px;
  }
  .tab {
    display: flex; align-items: center; gap: 7px;
    padding: 8px 14px; font-size: 13px; color: var(--text-dim);
    border-radius: 8px 8px 0 0; cursor: pointer; white-space: nowrap;
    transition: all .15s; border: 1px solid transparent;
    user-select: none; flex-shrink: 0;
  }
  .tab:hover { color: var(--text); background: rgba(255,255,255,.03); }
  .tab.active {
    color: var(--text); background: var(--panel);
    border-color: var(--border); border-bottom-color: var(--panel);
    margin-bottom: -1px;
  }
  .tab .tab-query { max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
  .tab .tab-status { font-size: 11px; }
  .tab .tab-status.running { color: var(--blue); }
  .tab .tab-status.done { color: var(--green); }
  .tab .tab-status.error { color: var(--red); }
  .tab .tab-close {
    width: 18px; height: 18px; border-radius: 4px; display: flex; align-items: center;
    justify-content: center; font-size: 14px; color: var(--text-dim);
    transition: all .1s; margin-left: 2px;
  }
  .tab .tab-close:hover { background: rgba(255,255,255,.1); color: var(--text); }

  /* ── main content ── */
  .main-area {
    flex: 1; display: flex; overflow: hidden;
  }
  .log-panel {
    flex: 1; display: flex; flex-direction: column; min-width: 0;
  }
  .log-scroll {
    flex: 1; overflow-y: auto; padding: 10px 20px;
  }
  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; color: var(--text-dim); font-size: 13px; text-align: center; gap: 8px;
  }
  .empty-state .icon { font-size: 36px; opacity: .3; }

  /* ── log entries ── */
  .log-entry {
    display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid rgba(37,40,54,.4);
    font-size: 13px; line-height: 1.5; animation: fadeIn .2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .log-dot {
    width: 7px; height: 7px; border-radius: 50%; margin-top: 4px; flex-shrink: 0;
  }
  .log-dot.s { background: var(--orange); box-shadow: 0 0 5px rgba(245,158,11,.5); }
  .log-dot.a { background: var(--blue); box-shadow: 0 0 5px rgba(59,130,246,.5); }
  .log-dot.t { background: var(--green); box-shadow: 0 0 5px rgba(34,197,94,.5); }
  .log-dot.r { background: var(--purple); box-shadow: 0 0 5px rgba(168,85,247,.5); }
  .log-dot.e { background: var(--red); box-shadow: 0 0 5px rgba(239,68,68,.5); }
  .log-body { flex: 1; min-width: 0; }
  .log-tag {
    display: inline-block; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 3px;
    text-transform: uppercase; letter-spacing: .5px; margin-right: 6px; vertical-align: middle;
  }
  .log-tag.s { color: var(--orange); background: var(--orange-bg); }
  .log-tag.a { color: var(--blue); background: var(--blue-bg); }
  .log-tag.t { color: var(--green); background: var(--green-bg); }
  .log-tag.r { color: var(--purple); background: var(--purple-bg); }
  .log-tag.e { color: var(--red); background: var(--red-bg); }
  .log-msg { color: var(--text); word-break: break-word; }
  .log-time { font-size: 11px; color: var(--text-dim); margin-top: 1px; }
  .log-result-block {
    margin-top: 4px; padding: 8px 10px; background: var(--bg); border-radius: 5px;
    border-left: 3px solid var(--purple); font-size: 12px; line-height: 1.6;
    max-height: 200px; overflow-y: auto; color: var(--text-dim); white-space: pre-wrap;
  }

  /* ── 意图徽标 / 耗时面板 / 工具输出 / 记忆事件 ── */
  .log-dot.i { background: var(--accent); box-shadow: 0 0 5px var(--accent-glow); }
  .log-tag.i { color: #c7d2fe; background: var(--accent-glow); }
  .log-dot.m { background: var(--teal); box-shadow: 0 0 5px rgba(45,212,191,.5); }
  .log-tag.m { color: var(--teal); background: var(--teal-bg); }
  .log-dot.u { background: var(--text); box-shadow: 0 0 5px rgba(255,255,255,.25); }
  .log-tag.u { color: var(--text-dim); background: rgba(255,255,255,.08); }
  .intent-badge {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 3px;
    padding: 4px 11px; border-radius: 999px; font-size: 12px; font-weight: 600;
    color: #c7d2fe; background: var(--accent-glow); border: 1px solid rgba(99,102,241,.4);
  }
  .intent-sub { font-size: 11.5px; color: var(--text-dim); margin-top: 4px; }

  .timing-panel {
    margin-top: 5px; padding: 10px 12px; max-width: 620px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--bg);
  }
  .timing-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .timing-chip {
    font-size: 11.5px; color: var(--text-dim); padding: 2px 9px; border-radius: 999px;
    background: rgba(255,255,255,.04); border: 1px solid var(--border);
  }
  .timing-chip b { color: var(--text); font-weight: 600; }
  .timing-row { display: flex; align-items: center; gap: 8px; margin: 5px 0; font-size: 11.5px; }
  .timing-label { width: 62px; flex-shrink: 0; color: var(--text-dim); }
  .timing-track {
    flex: 1; height: 6px; border-radius: 999px; background: rgba(255,255,255,.05); overflow: hidden;
  }
  .timing-fill { display: block; height: 100%; border-radius: 999px; }
  .timing-ms {
    width: 58px; text-align: right; color: var(--text-dim); flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }

  .tool-output {
    margin-top: 5px; border: 1px solid var(--border); border-radius: 7px;
    background: var(--bg); overflow: hidden;
  }
  .tool-output summary {
    padding: 6px 10px; font-size: 11.5px; color: var(--text-dim); cursor: pointer;
    user-select: none; list-style: none;
  }
  .tool-output summary::-webkit-details-marker { display: none; }
  .tool-output summary:hover { color: var(--text); }
  .tool-output pre {
    margin: 0; padding: 8px 10px; max-height: 190px; overflow: auto;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 11.5px; line-height: 1.6; color: var(--text-dim);
    white-space: pre-wrap; word-break: break-word; border-top: 1px solid var(--border);
  }
  .mem-detail { margin-top: 4px; font-size: 11.5px; color: var(--text-dim); }
  .mem-detail li { margin: 3px 0 3px 16px; }

  /* ── 最终结果卡片（重点显示） ── */
  .result-card {
    margin: 10px 0 8px; border: 1px solid rgba(99,102,241,.45); border-radius: 12px;
    background: linear-gradient(180deg, rgba(99,102,241,.10), rgba(99,102,241,.02));
    box-shadow: 0 0 0 3px rgba(99,102,241,.05), 0 10px 28px rgba(0,0,0,.35);
    overflow: hidden; animation: resultIn .35s ease;
  }
  @keyframes resultIn {
    from { opacity: 0; transform: translateY(10px) scale(.996); }
    to   { opacity: 1; transform: none; }
  }
  .result-head {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    background: rgba(99,102,241,.16); border-bottom: 1px solid rgba(99,102,241,.28);
    font-size: 13px; font-weight: 700; letter-spacing: .3px;
  }
  .result-head .badge {
    display: inline-flex; align-items: center; gap: 6px; color: #c7d2fe;
    background: rgba(99,102,241,.25); border: 1px solid rgba(99,102,241,.45);
    padding: 3px 10px; border-radius: 999px; font-size: 12px;
  }
  .result-head .meta { color: var(--text-dim); font-weight: 500; font-size: 12px; margin-left: auto; }
  .result-head .btn { padding: 4px 10px; font-size: 11px; }
  .result-body {
    padding: 18px 22px; font-size: 14.5px; line-height: 1.85; color: var(--text);
    max-height: 58vh; overflow-y: auto;
  }
  .result-card.collapsed .result-body { display: none; }
  .result-body h1.md-h { font-size: 19px; margin: 2px 0 10px; }
  .result-body h2.md-h {
    font-size: 17px; margin: 18px 0 8px; padding-bottom: 5px;
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .result-body h3.md-h { font-size: 15.5px; margin: 14px 0 6px; }
  .result-body h4.md-h, .result-body h5.md-h, .result-body h6.md-h { font-size: 14.5px; margin: 12px 0 6px; }
  .result-body .md-h { color: #eef2ff; font-weight: 700; line-height: 1.45; }
  .result-body p { margin: 8px 0; }
  .result-body ul, .result-body ol { margin: 8px 0 8px 22px; }
  .result-body li { margin: 4px 0; }
  .result-body code {
    background: rgba(255,255,255,.09); padding: 1.5px 5px; border-radius: 4px; font-size: 13px;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace; color: #a5b4fc;
  }
  .result-body pre {
    background: #0b0d14; border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; overflow-x: auto; margin: 12px 0;
  }
  .result-body pre code { background: none; padding: 0; color: #cbd5e1; font-size: 12.5px; line-height: 1.7; }
  .result-body table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 13.5px; }
  .result-body th, .result-body td { border: 1px solid var(--border); padding: 7px 10px; text-align: left; }
  .result-body th { background: rgba(255,255,255,.05); font-weight: 600; }
  .result-body blockquote {
    border-left: 3px solid var(--accent); margin: 10px 0; padding: 6px 12px;
    color: var(--text-dim); background: rgba(99,102,241,.07); border-radius: 0 6px 6px 0;
  }
  .result-body hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
  .result-body a { color: #7dd3fc; }
  .error-card { border-color: rgba(239,68,68,.5); background: rgba(239,68,68,.08); box-shadow: none; }
  .error-card .result-head { background: rgba(239,68,68,.16); border-bottom-color: rgba(239,68,68,.3); }
  .error-card .result-head .badge {
    color: #fecaca; background: rgba(239,68,68,.25); border-color: rgba(239,68,68,.45);
  }
  .error-card .result-body { color: #fecaca; }

  /* ── 流式回答（token 增量） ── */
  .stream-card { border-style: dashed; }
  .stream-card .result-head { background: rgba(99,102,241,.10); }
  .stream-card .result-body { max-height: 46vh; }
  .stream-cursor {
    display: inline-block; width: 7px; height: 15px; margin-left: 2px;
    border-radius: 1px; background: var(--accent); vertical-align: -2px;
    animation: blink 1s steps(2, start) infinite;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

  /* ── file panel ── */
  .file-panel {
    width: 300px; flex-shrink: 0; display: flex; flex-direction: column;
    border-left: 1px solid var(--border); background: var(--panel);
  }
  .file-panel-header {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    font-size: 12px; font-weight: 600; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: .8px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .file-list { flex: 1; overflow-y: auto; padding: 8px 10px; }
  .file-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 7px; cursor: pointer;
    transition: background .12s; margin-bottom: 2px;
  }
  .file-item:hover { background: rgba(255,255,255,.04); }
  .file-icon { font-size: 18px; flex-shrink: 0; }
  .file-info { flex: 1; min-width: 0; }
  .file-name { font-size: 12px; font-weight: 500; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-meta { font-size: 11px; color: var(--text-dim); }
  .file-item .btn { padding: 4px 10px; font-size: 11px; border-radius: 5px; }

  /* ── 记忆面板（右侧栏下半区） ── */
  .file-panel-header.sub-header { border-top: 1px solid var(--border); }
  .memory-list {
    max-height: 36vh; flex-shrink: 0; overflow-y: auto; padding: 8px 10px;
  }
  .memory-list .empty-state { height: auto; padding: 16px 0; }
  .memory-item {
    padding: 8px 9px; border-radius: 7px; background: rgba(255,255,255,.02);
    border: 1px solid rgba(37,40,54,.7); margin-bottom: 6px; transition: opacity .15s;
  }
  .memory-item:hover { background: rgba(255,255,255,.04); }
  .mem-top { display: flex; align-items: center; gap: 6px; }
  .mem-type {
    font-size: 10px; font-weight: 700; letter-spacing: .3px; padding: 1px 6px;
    border-radius: 3px; color: var(--teal); background: var(--teal-bg);
  }
  .mem-meta { font-size: 10.5px; color: var(--text-dim); }
  .mem-del {
    margin-left: auto; padding: 1px 7px !important; font-size: 13px !important;
    line-height: 1.2 !important; color: var(--text-dim);
  }
  .mem-del:hover { color: var(--red); border-color: rgba(239,68,68,.5); }
  .mem-content {
    font-size: 11.5px; line-height: 1.55; color: var(--text); margin-top: 4px;
    word-break: break-word; display: -webkit-box; -webkit-line-clamp: 3;
    -webkit-box-orient: vertical; overflow: hidden;
  }

  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
</style>
</head>
<body>

<header>
  <h1>🤖 MultiAgent <span>Search</span></h1>
  <div class="ws-badge">
    <div class="ws-dot" id="wsDot"></div>
    <span id="wsStatus">就绪</span>
  </div>
</header>

<div class="input-bar">
  <input id="queryInput" type="text" placeholder="输入问题，回车发送；默认延续当前会话上下文，点「＋ 新会话」可另起一个" />
  <button class="btn btn-primary" id="sendBtn" onclick="sendTask()">▶ 发送任务</button>
  <button class="btn btn-ghost" onclick="startNewConversation()" title="另起一个会话，不沿用当前会话的上下文">＋ 新会话</button>
  <button class="btn btn-ghost" onclick="closeAllSessions()">清除全部</button>
</div>

<div class="tab-bar" id="tabBar"></div>

<div class="main-area">
  <div class="log-panel">
    <div class="log-scroll" id="logArea"></div>
  </div>
  <div class="file-panel">
    <div class="file-panel-header">
      <span>生成的报告</span>
      <button class="btn btn-ghost" onclick="refreshFiles()" style="padding:3px 9px;font-size:10px;">刷新</button>
    </div>
    <div class="file-list" id="fileList"></div>
    <div class="file-panel-header sub-header">
      <span>🧠 长期记忆</span>
      <button class="btn btn-ghost" onclick="refreshMemory()" style="padding:3px 9px;font-size:10px;">刷新</button>
    </div>
    <div class="memory-list" id="memoryList">
      <div class="empty-state"><div class="icon">🧠</div><div>暂无长期记忆</div></div>
    </div>
  </div>
</div>

<script>
// ── 会话管理 ──
const sessions = {};    // { threadId: { id, query, logs[], ws, dir, status, element } }
let activeSessionId = null;
let fileRefreshTimer = null;

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

const tagMap = {
  session_created: { dot:'s', tag:'s', text:'会话' },
  assistant_call:  { dot:'a', tag:'a', text:'调度' },
  tool_start:      { dot:'t', tag:'t', text:'工具' },
  tool_result:     { dot:'t', tag:'t', text:'输出' },
  task_result:     { dot:'r', tag:'r', text:'完成' },
  error:           { dot:'e', tag:'e', text:'错误' },
  intent:          { dot:'i', tag:'i', text:'意图' },
  timing:          { dot:'i', tag:'i', text:'耗时' },
  memory:          { dot:'m', tag:'m', text:'记忆' },
  user:            { dot:'u', tag:'u', text:'提问' },
};

function createSession(threadId, query) {
  const session = {
    id: threadId,
    query,
    logs: [],
    ws: null,
    dir: null,
    status: 'running', // running | done | error
    el: null,
    streamText: '',    // token 事件累计的流式回答（不进 logs，避免整屏重渲染）
    streaming: false,
    _streamRaf: null,
  };
  sessions[threadId] = session;

  // 第一轮提问也记一条日志，和续聊时的「提问」保持一致
  session.logs.push({
    event: 'user', message: query, data: null,
    timestamp: new Date().toISOString(),
  });

  // 连 WebSocket
  attachSessionSocket(session);

  // 切换到此会话
  switchSession(threadId);
  scheduleFileRefresh();
}

// 连接（或重连）某个会话的 WebSocket。
// 续聊时沿用同一个 thread_id，服务端据此命中 LangGraph checkpoint 里的历史消息。
function attachSessionSocket(session) {
  const threadId = session.id;
  if (session.ws) {
    const oldWs = session.ws;
    try {
      // 先摘掉旧连接的回调再关闭，避免旧连接的 close 事件把刚转为 running 的会话误标成 done
      oldWs.onopen = null; oldWs.onmessage = null; oldWs.onclose = null; oldWs.onerror = null;
      oldWs.close();
    } catch (_) {}
    session.ws = null;
  }

  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = `${proto}//${location.host}/ws/${threadId}`;
  const ws = new WebSocket(url);
  ws.onopen = () => { updateWSStatus(); };
  ws.onmessage = (e) => {
    try {
      const d = JSON.parse(e.data);
      if (d.type === 'pong') return;
      if (d.type !== 'monitor_event') return;
      const data = d.data || {};

      // token：最终回答的流式增量。单独维护，不塞进 logs，避免每个 token 都重渲染整屏。
      if (d.event === 'token') {
        if (session.status !== 'running') return;      // 已结束的任务忽略迟到 token
        if (typeof data.text === 'string' && data.text) {
          session.streamText += data.text;
          scheduleStreamRender(session);
        }
        return;
      }

      session.logs.push({ event: d.event, message: d.message, data: d.data, timestamp: d.timestamp });
      if (d.event === 'session_created' && data.path) {
        session.dir = data.path;
        scheduleFileRefresh();
      }
      if (d.event === 'task_result') {
        session.status = 'done';
        // 流式内容交给 task_result 的最终完整文本（结果卡片），清掉临时流式状态
        session.streamText = '';
        session.streaming = false;
        const streamEl = document.getElementById(`stream_${threadId}`);
        if (streamEl) streamEl.remove();
        scheduleFileRefresh();
        scheduleMemoryRefresh(1500);  // 任务完成后刷新记忆面板
      }
      if (d.event === 'error') {
        session.status = 'error';
        session.streamText = '';
        session.streaming = false;
      }
      // 本次任务写入了新记忆：稍等落库后刷新面板
      if (d.event === 'memory' && Array.isArray(data.written) && data.written.length) {
        scheduleMemoryRefresh(1200);
      }

      renderTabs();
      if (activeSessionId === threadId) renderLog(session);
    } catch (_) {}
  };
  ws.onclose = () => {
    if (session.status === 'running') session.status = 'done';
    session.streaming = false;
    if (session.streamText && activeSessionId === threadId) renderLog(session);
    updateWSStatus();
    renderTabs();
  };
  ws.onerror = () => { session.status = 'error'; updateWSStatus(); renderTabs(); };
  session.ws = ws;
}

// 等待 WebSocket 建立（续聊时先连上再发请求，避免漏掉任务开头的事件）
function waitSocketOpen(ws, timeoutMs = 1200) {
  return new Promise(resolve => {
    if (!ws || ws.readyState === WebSocket.OPEN) { resolve(true); return; }
    let settled = false;
    const finish = ok => { if (!settled) { settled = true; resolve(ok); } };
    ws.addEventListener('open', () => finish(true), { once: true });
    ws.addEventListener('error', () => finish(false), { once: true });
    ws.addEventListener('close', () => finish(false), { once: true });
    setTimeout(() => finish(false), timeoutMs);
  });
}

function switchSession(threadId) {
  if (activeSessionId && sessions[activeSessionId]) {
    // 保存滚动位置
    const area = $('#logArea');
    sessions[activeSessionId]._scrollTop = area.scrollTop;
  }
  activeSessionId = threadId;
  const s = sessions[threadId];
  if (!s) { renderLog(null); return; }
  renderLog(s);
  // 恢复滚动位置
  $('#logArea').scrollTop = s._scrollTop || 0;
  renderTabs();
  refreshFiles();
}

function closeSession(threadId) {
  const s = sessions[threadId];
  if (!s) return;
  if (s.ws) { s.ws.close(); s.ws = null; }
  delete sessions[threadId];

  if (activeSessionId === threadId) {
    const ids = Object.keys(sessions);
    if (ids.length > 0) {
      switchSession(ids[ids.length - 1]); // 切到最新的
    } else {
      activeSessionId = null;
      renderLog(null);
    }
  }
  renderTabs();
  updateWSStatus();
}

function closeAllSessions() {
  Object.keys(sessions).forEach(id => {
    if (sessions[id].ws) sessions[id].ws.close();
  });
  Object.keys(sessions).forEach(id => delete sessions[id]);
  activeSessionId = null;
  renderLog(null);
  renderTabs();
  updateWSStatus();
}

// ── 标签栏渲染 ──
function renderTabs() {
  const bar = $('#tabBar');
  const ids = Object.keys(sessions);
  updateSendButton();
  if (ids.length === 0) { bar.innerHTML = ''; return; }

  bar.innerHTML = ids.map(id => {
    const s = sessions[id];
    const active = id === activeSessionId ? ' active' : '';
    const statusIcon = s.status === 'running' ? '⏳' : s.status === 'error' ? '❌' : '✅';
    return `<div class="tab${active}" onclick="switchSession('${id}')">
      <span class="tab-status ${s.status}">${statusIcon}</span>
      <span class="tab-query" title="${escapeAttr(s.query)}">${escapeHtml(s.query.substring(0, 20))}${s.query.length > 20 ? '...' : ''}</span>
      <span class="tab-close" onclick="event.stopPropagation();closeSession('${id}')">×</span>
    </div>`;
  }).join('');
}

// ── 迷你 Markdown 渲染（够用即可，不引第三方库） ──
function inlineMd(s) {
  return s
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
}

function mdToHtml(md) {
  const lines = escapeHtml(md || '').split(/\r?\n/);
  const out = [];
  let i = 0, inUl = false, inOl = false, inCode = false;
  let codeBuf = [];
  const closeLists = () => {
    if (inUl) { out.push('</ul>'); inUl = false; }
    if (inOl) { out.push('</ol>'); inOl = false; }
  };
  while (i < lines.length) {
    const raw = lines[i];
    const line = raw.replace(/\s+$/, '');
    if (/^\s*```/.test(line)) {
      if (!inCode) { closeLists(); inCode = true; codeBuf = []; }
      else { out.push(`<pre><code>${codeBuf.join('\n')}</code></pre>`); inCode = false; }
      i++; continue;
    }
    if (inCode) { codeBuf.push(raw); i++; continue; }
    if (!line.trim()) { closeLists(); i++; continue; }

    // 表格：本行含 | 且下一行是分隔行
    if (line.includes('|') && i + 1 < lines.length && /^\s*\|?[\s:|-]*-[\s:|-]*$/.test(lines[i + 1])) {
      closeLists();
      const cells = r => r.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(c => inlineMd(c.trim()));
      const head = cells(line);
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].includes('|') && lines[i].trim()) { rows.push(cells(lines[i])); i++; }
      out.push('<table><thead><tr>' + head.map(h => `<th>${h}</th>`).join('') + '</tr></thead><tbody>'
        + rows.map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join('') + '</tr>').join('') + '</tbody></table>');
      continue;
    }

    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { closeLists(); const lv = h[1].length; out.push(`<h${lv} class="md-h">${inlineMd(h[2])}</h${lv}>`); i++; continue; }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { closeLists(); out.push('<hr>'); i++; continue; }
    if (/^(&gt;|>)\s?/.test(line)) {
      closeLists();
      out.push(`<blockquote>${inlineMd(line.replace(/^(&gt;|>)\s?/, ''))}</blockquote>`); i++; continue;
    }

    const ul = line.match(/^\s*[-*+]\s+(.*)$/);
    if (ul) {
      if (inOl) { out.push('</ol>'); inOl = false; }
      if (!inUl) { out.push('<ul>'); inUl = true; }
      out.push(`<li>${inlineMd(ul[1])}</li>`); i++; continue;
    }
    const ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (ol) {
      if (inUl) { out.push('</ul>'); inUl = false; }
      if (!inOl) { out.push('<ol>'); inOl = true; }
      out.push(`<li>${inlineMd(ol[1])}</li>`); i++; continue;
    }
    closeLists();
    out.push(`<p>${inlineMd(line)}</p>`);
    i++;
  }
  if (inCode) out.push(`<pre><code>${codeBuf.join('\n')}</code></pre>`);
  closeLists();
  return out.join('\n');
}

// ── 日志渲染 ──
function renderLog(session) {
  const area = $('#logArea');
  const atBottom = area.scrollHeight - area.scrollTop - area.clientHeight < 80;

  if (!session || (session.logs.length === 0 && !session.streamText)) {
    area.innerHTML = `<div class="empty-state"><div class="icon">📋</div><div>${session ? '等待 Agent 响应...' : '发送一个任务开始调试'}</div></div>`;
    return;
  }

  area.innerHTML = session.logs.map((l, idx) => {
    const t = tagMap[l.event] || tagMap.tool_start;
    const head = `<div class="log-dot ${t.dot}"></div>
      <div class="log-body">
        <span class="log-tag ${t.tag}">${t.text}</span>
        <span class="log-msg">${escapeHtml(l.message)}</span>`;
    const tail = `<div class="log-time">${fmtTime(l.timestamp)}</div></div></div>`;

    // ① 最终结果：大卡片 + Markdown 渲染
    if (l.event === 'task_result' && l.data?.result) {
      const text = String(l.data.result);
      const cid = `rc_${session.id}_${idx}`;
      return `<div class="log-entry">${head}
        <div class="result-card" id="${cid}">
          <div class="result-head">
            <span class="badge">🏁 最终分析结果</span>
            <span class="meta">${text.length} 字符${l.data.files ? ' · ' + l.data.files + ' 个文件' : ''}</span>
            <button class="btn btn-ghost btn-toggle" onclick="toggleResult('${cid}')">折叠</button>
            <button class="btn btn-ghost btn-copy" onclick="copyResult('${cid}')">复制全文</button>
          </div>
          <div class="result-body">${mdToHtml(text)}</div>
        </div>${tail}`;
    }

    // ② 错误：红色卡片
    if (l.event === 'error') {
      return `<div class="log-entry">${head}
        <div class="result-card error-card">
          <div class="result-head"><span class="badge">执行失败</span></div>
          <div class="result-body"><p>${escapeHtml(l.message)}</p></div>
        </div>${tail}`;
    }

    // ③ 意图徽标：意图：数据分析 · 置信度 0.86 · L2-classifier
    if (l.event === 'intent' && l.data) {
      const d = l.data;
      const conf = Number(d.confidence);
      const confTxt = Number.isFinite(conf) ? conf.toFixed(2) : '-';
      const zh = escapeHtml(String(d.label_zh || d.label || '未知'));
      const layer = d.layer ? ' · ' + escapeHtml(String(d.layer)) : '';
      const subs = (Array.isArray(d.suggested_subagents) && d.suggested_subagents.length)
        ? `<div class="intent-sub">建议子智能体：${d.suggested_subagents.map(x => escapeHtml(String(x))).join(' · ')}</div>`
        : '';
      return `<div class="log-entry">${head}<div class="intent-badge">🎯 意图：${zh} · 置信度 ${confTxt}${layer}</div>${subs}${tail}`;
    }

    // ④ 耗时面板：首字延迟 / 总耗时 / 各阶段耗时
    if (l.event === 'timing' && l.data) {
      return `<div class="log-entry">${head}${timingPanelHTML(l.data)}${tail}`;
    }

    // ⑤ 工具输出摘要（默认折叠，点击展开）
    if (l.event === 'tool_result' && l.data) {
      return `<div class="log-entry">${head}${toolOutputHTML(l.data)}${tail}`;
    }

    // ⑥ 记忆事件（召回 / 写入，可选展示）
    if (l.event === 'memory' && l.data) {
      return `<div class="log-entry">${head}${memoryEventHTML(l.data)}${tail}`;
    }

    // ⑦ 工具/调度等中间过程：保持紧凑
    const resultBlock = l.data?.result
      ? `<div class="log-result-block">${escapeHtml(String(l.data.result).substring(0, 800))}${String(l.data.result).length > 800 ? '…' : ''}</div>`
      : '';
    return `<div class="log-entry">${head}${resultBlock}${tail}`;
  }).join('');

  // 流式回答进行中：追加在日志最下方（切换会话 / 中间事件触发重渲染时保留已收增量）
  if (session.streamText) area.insertAdjacentHTML('beforeend', streamCardHTML(session));

  if (atBottom) area.scrollTop = area.scrollHeight;
}

// ── 流式回答（token 增量渲染） ──
function streamCardHTML(session) {
  const sid = session.id;
  return `<div class="log-entry" id="stream_${sid}">
    <div class="log-dot a"></div>
    <div class="log-body">
      <span class="log-tag a">流式</span>
      <span class="log-msg">主智能体正在生成最终回答…</span>
      <div class="result-card stream-card">
        <div class="result-head">
          <span class="badge">✍️ 流式回答</span>
          <span class="meta" id="streamMeta_${sid}">${(session.streamText || '').length} 字符</span>
        </div>
        <div class="result-body" id="streamBody_${sid}">${mdToHtml(session.streamText || '')}${session.streaming ? '<span class="stream-cursor"></span>' : ''}</div>
      </div>
      <div class="log-time">${session.streaming ? '生成中…' : '已停止'}</div>
    </div>
  </div>`;
}

function scheduleStreamRender(session) {
  session.streaming = true;
  if (activeSessionId !== session.id) return;      // 非当前会话只累计文本，切换回来时整屏渲染
  if (session._streamRaf) return;
  session._streamRaf = requestAnimationFrame(() => {
    session._streamRaf = null;
    updateStream(session);
  });
}

function updateStream(session) {
  if (activeSessionId !== session.id) return;
  const area = $('#logArea');
  let body = document.getElementById('streamBody_' + session.id);
  if (!body) {
    // 首个 token：把空态提示换成流式卡片
    const empty = area.querySelector('.empty-state');
    if (empty) empty.remove();
    area.insertAdjacentHTML('beforeend', streamCardHTML(session));
    body = document.getElementById('streamBody_' + session.id);
    if (!body) return;
  }
  body.innerHTML = mdToHtml(session.streamText || '') + (session.streaming ? '<span class="stream-cursor"></span>' : '');
  const meta = document.getElementById('streamMeta_' + session.id);
  if (meta) meta.textContent = `${(session.streamText || '').length} 字符`;
  area.scrollTop = area.scrollHeight;   // 流式输出自动滚动到底部
}

// ── 耗时面板 ──
function fmtMs(ms) {
  const n = Number(ms);
  if (!Number.isFinite(n) || n < 0) return '-';
  return n >= 1000 ? (n / 1000).toFixed(2) + 's' : Math.round(n) + 'ms';
}

function timingPanelHTML(data) {
  const t = data.timings || {};
  const num = v => { const n = Number(v); return Number.isFinite(n) && n > 0 ? n : 0; };
  const total = num(t.total_ms);
  const first = num(t.first_token_ms);
  const calls = num(t.tool_calls);
  const phases = [
    ['检索', num(t.retrieve_ms), 'var(--blue)'],
    ['LLM', num(t.llm_ms), 'var(--accent)'],
    ['工具', num(t.tool_ms), 'var(--orange)'],
    ['子智能体', num(t.subagent_ms), 'var(--purple)'],
  ].filter(p => p[1] > 0);
  const base = total > 0 ? total : (phases.reduce((s, p) => s + p[1], 0) || 1);
  const rows = phases.map(([label, ms, color]) => {
    const pct = Math.max(2, Math.min(100, ms / base * 100)).toFixed(1);
    return `<div class="timing-row">
      <span class="timing-label">${label}</span>
      <span class="timing-track"><span class="timing-fill" style="width:${pct}%;background:${color};"></span></span>
      <span class="timing-ms">${fmtMs(ms)}</span>
    </div>`;
  }).join('');
  return `<div class="timing-panel">
    <div class="timing-chips">
      <span class="timing-chip">首字 <b>${fmtMs(first)}</b></span>
      <span class="timing-chip">总耗时 <b>${fmtMs(total)}</b></span>
      <span class="timing-chip">工具调用 <b>${Math.round(calls)}</b> 次</span>
    </div>${rows}</div>`;
}

// ── 工具输出摘要（可折叠） ──
function toolOutputHTML(data) {
  const out = String(data.output == null ? '' : data.output);
  const chars = Number.isFinite(Number(data.chars)) ? Number(data.chars) : out.length;
  const shown = out.length > 4000 ? out.slice(0, 4000) + '\n…' : out;
  const openAttr = out.length <= 300 ? ' open' : '';
  return `<details class="tool-output"${openAttr}>
    <summary>📤 输出摘要 · ${chars} 字符${data.truncated ? ' · 已截断' : ''} · 点击展开/收起</summary>
    <pre>${escapeHtml(shown)}</pre>
  </details>`;
}

// ── 记忆事件（召回 / 写入） ──
function memoryEventHTML(data) {
  const retrieved = Array.isArray(data.retrieved) ? data.retrieved : [];
  const written = Array.isArray(data.written) ? data.written : [];
  const parts = [];
  if (retrieved.length) {
    const items = retrieved.map(m => {
      const score = Number.isFinite(Number(m.score)) ? Number(m.score).toFixed(2) : '-';
      const content = truncateText(m.content, 160);
      return `<li>[记忆 #${escapeHtml(String(m.id ?? '?'))}] ${escapeHtml(content)} <span style="color:var(--text-dim)">(${escapeHtml(String(m.type || '记忆'))} · ${score})</span></li>`;
    }).join('');
    parts.push(`<div class="mem-detail">召回 ${retrieved.length} 条记忆：<ul>${items}</ul></div>`);
  }
  if (written.length) parts.push(`<div class="mem-detail">写入 ${written.length} 条新记忆</div>`);
  return parts.join('') || '<div class="mem-detail">本次无记忆变更</div>';
}

// ── 结果卡片交互 ──
function toggleResult(id) {
  const card = document.getElementById(id);
  if (!card) return;
  card.classList.toggle('collapsed');
  const btn = card.querySelector('.btn-toggle');
  if (btn) btn.textContent = card.classList.contains('collapsed') ? '展开' : '折叠';
}

async function copyResult(id) {
  const card = document.getElementById(id);
  if (!card) return;
  const body = card.querySelector('.result-body');
  const txt = body ? body.innerText : '';
  try {
    await navigator.clipboard.writeText(txt);
  } catch (_) {
    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (__) {}
    document.body.removeChild(ta);
  }
  const btn = card.querySelector('.btn-copy');
  if (btn) {
    const old = btn.textContent;
    btn.textContent = '已复制 ✓';
    setTimeout(() => { btn.textContent = old; }, 1400);
  }
}

// ── 发送任务：默认延续当前会话，只有点「＋ 新会话」后才另起一个 thread ──
async function sendTask() {
  const input = $('#queryInput');
  const query = input.value.trim();
  if (!query) return;

  const active = activeSessionId ? sessions[activeSessionId] : null;
  if (active && active.status === 'running') {
    alert('当前会话还在执行，等它完成后再继续提问；也可以点「＋ 新会话」另开一个。');
    return;
  }
  const continueThreadId = active ? active.id : null;

  // 续聊：先把这一轮提问记进日志、重连 WS（同一 thread_id），再发请求
  if (continueThreadId) {
    appendUserTurn(active, query);
    attachSessionSocket(active);
  }

  const btn = $('#sendBtn');
  btn.disabled = true; btn.textContent = '发送中...';

  try {
    // 续聊：先等 WS 重新连上，再提交任务，避免漏掉任务开始阶段的事件
    if (continueThreadId && sessions[continueThreadId] && sessions[continueThreadId].ws) {
      await waitSocketOpen(sessions[continueThreadId].ws);
    }
    const payload = { query };
    if (continueThreadId) payload.thread_id = continueThreadId;   // 关键：带上原会话的 thread_id
    const res = await fetch('/api/task', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok || data.status !== 'started') {
      throw new Error(data.detail || data.error || ('HTTP ' + res.status));
    }
    if (continueThreadId && sessions[continueThreadId]) {
      switchSession(continueThreadId);
    } else {
      createSession(data.thread_id, query);
    }
  } catch (err) {
    if (continueThreadId && sessions[continueThreadId]) {
      const s = sessions[continueThreadId];
      s.status = 'error';
      s.logs.push({
        event: 'error', message: '发送失败：' + err.message,
        data: null, timestamp: new Date().toISOString(),
      });
      renderLog(s);
      renderTabs();
    }
    alert('请求失败: ' + err.message);
  } finally {
    input.value = '';
    input.focus();
    updateSendButton();
  }
}

// 把用户这一轮提问追加进当前会话日志，并转回 running 状态
function appendUserTurn(session, query) {
  session.logs.push({
    event: 'user',
    message: query,
    data: null,
    timestamp: new Date().toISOString(),
  });
  session.status = 'running';
  session.streamText = '';
  session.streaming = false;
  session._streamRaf = null;
  if (activeSessionId === session.id) renderLog(session);
  renderTabs();
}

// 另起一个新会话：仅取消当前选中，下一条消息会创建新 thread
function startNewConversation() {
  activeSessionId = null;
  renderLog(null);
  renderTabs();
  const input = $('#queryInput');
  input.value = '';
  input.focus();
}

// 根据当前选中的会话状态刷新输入区按钮
function updateSendButton() {
  const btn = $('#sendBtn');
  if (!btn) return;
  const s = activeSessionId ? sessions[activeSessionId] : null;
  if (s && s.status === 'running') {
    btn.disabled = true;
    btn.textContent = '⏳ 执行中...';
  } else if (s) {
    btn.disabled = false;
    btn.textContent = '▶ 继续当前会话';
  } else {
    btn.disabled = false;
    btn.textContent = '▶ 发送任务';
  }
}

// ── WS 状态 ──
function updateWSStatus() {
  const ids = Object.keys(sessions);
  const hasActive = ids.some(id => sessions[id].ws && sessions[id].ws.readyState === WebSocket.OPEN);
  const dot = $('#wsDot');
  const txt = $('#wsStatus');
  dot.className = 'ws-dot' + (hasActive ? '' : ' off');
  txt.textContent = ids.length === 0 ? '就绪' : `${ids.length} 个会话${hasActive ? ' · 已连接' : ''}`;
}

// ── 文件浏览 ──
function scheduleFileRefresh() {
  if (fileRefreshTimer) clearTimeout(fileRefreshTimer);
  fileRefreshTimer = setTimeout(refreshFiles, 3000);
}

async function refreshFiles() {
  const list = $('#fileList');
  try {
    const res = await fetch('/api/files');
    const d = await res.json();
    if (d.error || !d.files || d.files.length === 0) {
      list.innerHTML = `<div class="empty-state"><div class="icon">📂</div><div>还未生成文件</div></div>`;
      return;
    }
    // 优先显示当前活跃会话的文件
    const currentDir = activeSessionId ? `session_${activeSessionId}` : null;
    let files = d.files;
    // 按文件夹分组
    const groups = {};
    files.forEach(f => {
      const parts = f.path.replace(/\\/g, '/').split('/');
      const idx = parts.findIndex(p => p.startsWith('session_'));
      const grp = idx >= 0 ? parts[idx] : '其他';
      if (!groups[grp]) groups[grp] = [];
      groups[grp].push(f);
    });
    // 当前会话排前面
    const sorted = Object.entries(groups).sort((a,b) => {
      if (a[0] === currentDir) return -1;
      if (b[0] === currentDir) return 1;
      return b[0].localeCompare(a[0]);
    });

    let html = '';
    sorted.forEach(([grp, fs]) => {
      const isActive = grp === currentDir;
      html += `<div style="font-size:10px;color:var(--text-dim);padding:6px 10px 2px;letter-spacing:.5px;${isActive ? 'color:var(--accent);' : ''}">${isActive ? '▸ ' : ''}${grp}</div>`;
      fs.forEach(f => html += `
        <div class="file-item">
          <div class="file-icon">${iconFor(f.name)}</div>
          <div class="file-info">
            <div class="file-name" title="${escapeAttr(f.name)}">${escapeHtml(f.name)}</div>
            <div class="file-meta">${fmtSize(f.size)} · ${new Date(f.mtime*1000).toLocaleString('zh-CN')}</div>
          </div>
          <button class="btn btn-primary" onclick="event.stopPropagation();downloadFile('${encodeURIComponent(f.path)}')">下载</button>
        </div>`);
    });
    list.innerHTML = html;
  } catch (_) {}
}

// ── 长期记忆面板 ──
let memoryRefreshTimer = null;
const MEMORY_TYPE_LABELS = {
  fact: '事实', preference: '偏好', constraint: '约束', glossary: '术语',
  decision: '决策', task: '任务', context: '上下文', note: '笔记', other: '其他',
};

function scheduleMemoryRefresh(delayMs = 1200) {
  if (memoryRefreshTimer) clearTimeout(memoryRefreshTimer);
  memoryRefreshTimer = setTimeout(refreshMemory, delayMs);
}

function memoryTypeLabel(t) { return MEMORY_TYPE_LABELS[t] || (t ? String(t) : '记忆'); }

async function refreshMemory() {
  const list = $('#memoryList');
  if (!list) return;
  try {
    const res = await fetch('/api/memory?limit=20');
    const d = await res.json();
    if (!res.ok || d.error) throw new Error();
    const mems = Array.isArray(d.memories) ? d.memories : [];
    if (!mems.length) {
      list.innerHTML = `<div class="empty-state"><div class="icon">🧠</div><div>暂无长期记忆</div></div>`;
      return;
    }
    list.innerHTML = mems.map(memoryItemHTML).join('');
  } catch (_) {
    // 静默降级：接口未就绪/不可用时只提示，不弹错误、不影响主流程
    list.innerHTML = `<div class="empty-state"><div class="icon">🧠</div><div>记忆服务不可用</div></div>`;
  }
}

function memoryItemHTML(m) {
  const id = m && m.id != null ? String(m.id) : '';
  const type = m && m.type != null ? String(m.type) : '';
  const content = m && m.content != null ? String(m.content) : '';
  const conf = Number(m && m.confidence);
  const hits = Number(m && m.hit_count);
  const meta = [];
  if (Number.isFinite(conf)) meta.push('置信 ' + conf.toFixed(2));
  if (Number.isFinite(hits) && hits > 0) meta.push('命中 ' + hits);
  const metaTxt = meta.length ? `<span class="mem-meta">${escapeHtml(meta.join(' · '))}</span>` : '';
  const del = id
    ? `<button class="btn btn-ghost mem-del" title="删除这条记忆" onclick="deleteMemory('${escapeAttr(id)}')">×</button>`
    : '';
  return `<div class="memory-item" id="mem_${escapeAttr(id)}">
    <div class="mem-top"><span class="mem-type">${escapeHtml(memoryTypeLabel(type))}</span>${metaTxt}${del}</div>
    <div class="mem-content" title="${escapeAttr(content)}">${escapeHtml(content)}</div>
  </div>`;
}

async function deleteMemory(id) {
  const item = id ? document.getElementById('mem_' + String(id)) : null;
  try {
    const res = await fetch('/api/memory/' + encodeURIComponent(id), { method: 'DELETE' });
    const d = await res.json();
    if (!res.ok || d.error || d.deleted === false) throw new Error();
    if (item) item.remove();
    const list = $('#memoryList');
    if (list && !list.querySelector('.memory-item')) {
      list.innerHTML = `<div class="empty-state"><div class="icon">🧠</div><div>暂无长期记忆</div></div>`;
    }
  } catch (_) {
    // 删除失败不弹错误：短暂置灰作为反馈
    if (item) {
      item.style.opacity = '.4';
      setTimeout(() => { item.style.opacity = ''; }, 800);
    }
  }
}

// ── 工具函数 ──
function truncateText(s, n) {
  const str = s == null ? '' : String(s);
  const limit = Number(n) || 0;
  if (limit <= 0 || str.length <= limit) return str;
  return str.slice(0, limit) + '…';
}
function escapeHtml(s) { if (!s) return ''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escapeAttr(s) { if (!s) return ''; return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtTime(iso) { try { return new Date(iso).toLocaleTimeString('zh-CN',{hour12:false}); } catch(_) { return ''; } }
function fmtSize(b) {
  if (!b) return '0 B';
  const u = ['B','KB','MB','GB']; let i = 0;
  while (b >= 1024 && i < 3) { b /= 1024; i++; }
  return b.toFixed(i > 0 ? 1 : 0) + ' ' + u[i];
}
function iconFor(n) { if (n.endsWith('.md')) return '📝'; if (n.endsWith('.pdf')) return '📄'; return '📎'; }
function downloadFile(p) { window.open(`/api/download?path=${encodeURIComponent(p)}`,'_blank'); }

// ── 键盘 ──
$('#queryInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendTask(); }
});

// ── 初始 ──
updateWSStatus();
refreshFiles();
refreshMemory();
</script>
